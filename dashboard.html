<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.header{
background:#020617;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
padding:30px;
max-width:800px;
margin:auto;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
}

button{
padding:12px;
background:green;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
width:100%;
font-size:16px;
}

.post{
background:#111827;
padding:15px;
margin-top:20px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="header">🌾 Admin Dashboard - AgriDiary</div>

<div class="container">

<h2>Upload Research/Post</h2>

<input type="text" id="title" placeholder="Post title">
<textarea id="desc" placeholder="Write description"></textarea>

<button onclick="upload()">Upload Post</button>

<h2>All Posts</h2>
<div id="posts"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCRvzu0XxA2i9-eL0c3h8IMAAuNYnRcITo",
 authDomain: "agridiary-9d31f.firebaseapp.com",
 projectId: "agridiary-9d31f",
 storageBucket: "agridiary-9d31f.firebasestorage.app",
 messagingSenderId: "725259319539",
 appId: "1:725259319539:web:415c46c84ef2b9721e1f86"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// upload post
window.upload = async function(){
let title=document.getElementById("title").value;
let desc=document.getElementById("desc").value;

await addDoc(collection(db,"posts"),{
title:title,
desc:desc
});

alert("Post uploaded");
loadPosts();
}

// show posts
async function loadPosts(){
let div=document.getElementById("posts");
div.innerHTML="Loading...";

const querySnapshot = await getDocs(collection(db,"posts"));
div.innerHTML="";

querySnapshot.forEach((doc)=>{
let data=doc.data();
div.innerHTML+=`
<div class="post">
<h3>${data.title}</h3>
<p>${data.desc}</p>
</div>
`;
});
}

loadPosts();
</script>

</body>
</html>
