<!DOCTYPE html>
<html>
<head>
<title>Admin Login - AgriDiary</title>
<style>
body{
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}
.box{
background:#111827;
padding:40px;
border-radius:10px;
width:300px;
text-align:center;
}
input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
}
button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Admin email">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyCRvzu0XxA2i9-eL0c3h8IMAAuNYnRcITo",
 authDomain: "agridiary-9d31f.firebaseapp.com",
 projectId: "agridiary-9d31f",
 storageBucket: "agridiary-9d31f.firebasestorage.app",
 messagingSenderId: "725259319539",
 appId: "1:725259319539:web:415c46c84ef2b9721e1f86"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

signInWithEmailAndPassword(auth,email,pass)
.then(()=>{
location.href="dashboard.html";
})
.catch(()=>{
document.getElementById("msg").innerHTML="Login failed";
});
}
</script>

</body>
</html>
